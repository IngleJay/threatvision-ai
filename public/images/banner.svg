<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)" />
  <rect width="1200" height="420" fill="url(#grid)" />
  
  <!-- Cyber Glow Circles -->
  <circle cx="200" cy="180" r="220" fill="url(#cyberGlow)" />
  <circle cx="1000" cy="200" r="260" fill="url(#cyberGlow)" />

  <!-- Shield Icon Graphic -->
  <g transform="translate(100, 110)">
    <path d="M 60 10 L 110 30 L 110 100 Q 110 160 60 190 Q 10 160 10 100 L 10 30 Z" fill="url(#shieldGlow)" stroke="#818cf8" stroke-width="2.5" />
    <path d="M 60 25 L 98 40 L 98 98 Q 98 145 60 172 Q 22 145 22 98 L 22 40 Z" fill="#0b112c" stroke="#6366f1" stroke-width="1.5" />
    <!-- Pulse Line in Shield -->
    <path d="M 35 105 L 50 105 L 55 85 L 65 125 L 72 95 L 78 105 L 88 105" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Branding -->
  <text x="240" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    ThreatVision <tspan fill="url(#accent)">AI</tspan>
  </text>
  
  <text x="242" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
    Enterprise Threat Detection, AbuseIPDB Intelligence &amp; Payload Heuristics
  </text>

  <!-- Feature Pills -->
  <g transform="translate(242, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="38" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2" />
    <text x="18" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#c7d2fe">⚡ AbuseIPDB Telemetry</text>
    
    <!-- Pill 2 -->
    <rect x="205" y="0" width="180" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="220" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">🔍 IOC Extraction</text>
    
    <!-- Pill 3 -->
    <rect x="400" y="0" width="170" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="415" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">🛡️ Malware Scanner</text>

    <!-- Pill 4 -->
    <rect x="585" y="0" width="165" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="600" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#f59e0b">📊 MITRE ATT&amp;CK</text>
  </g>

  <!-- Right Visual: Telemetry Widget Graphic -->
  <g transform="translate(860, 70)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="280" height="280" rx="14" fill="#090d1e" stroke="#1e293b" stroke-width="1.5" />
    <!-- Header dots -->
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="5" fill="#10b981" />
    <text x="70" y="24" font-family="monospace" font-size="11" fill="#64748b">SENTINEL LIVE TELEMETRY</text>
    
    <line x1="0" y1="36" x2="280" y2="36" stroke="#1e293b" stroke-width="1" />

    <!-- Terminal Lines -->
    <text x="16" y="65" font-family="monospace" font-size="11" fill="#38bdf8">[INFO] Abuse Score Engine: READY</text>
    <text x="16" y="90" font-family="monospace" font-size="11" fill="#f43f5e">[ALERT] 192.42.116.210 (88% ABUSE)</text>
    <text x="16" y="112" font-family="monospace" font-size="10" fill="#94a3b8">  ↳ Port 22 SSH Brute-Force</text>
    <text x="16" y="132" font-family="monospace" font-size="10" fill="#94a3b8">  ↳ Country: NL | Reports: 142</text>

    <!-- Radar Meter Box -->
    <rect x="16" y="152" width="248" height="110" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <circle cx="65" cy="207" r="35" fill="none" stroke="#334155" stroke-dasharray="2 2" />
    <circle cx="65" cy="207" r="22" fill="none" stroke="#475569" />
    <line x1="65" y1="207" x2="88" y2="190" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    
    <text x="115" y="188" font-family="monospace" font-size="18" font-weight="900" fill="#f43f5e">88% RISK</text>
    <text x="115" y="206" font-family="monospace" font-size="10" fill="#94a3b8">Verdict: HIGH RISK</text>
    <text x="115" y="224" font-family="monospace" font-size="9" fill="#64748b">MITRE: T1110 / T1046</text>
    <text x="115" y="242" font-family="monospace" font-size="9" fill="#10b981">Action: Perimeter Block</text>
  </g>
</svg>
